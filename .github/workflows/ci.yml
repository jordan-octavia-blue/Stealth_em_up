name: CI

# Pushes to master plus every pull request. Deliberately not `branches: ['**']` on
# push: with a PR open that fires the whole job twice on the same commit.
on:
  push:
    branches: [master]
  pull_request:

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y libx11-dev libxi-dev libxcursor-dev libgl-dev libasound2-dev
      - uses: laytan/setup-odin@v2
        with:
          release: dev-2026-11
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Build
        run: ./odin/build.sh

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: laytan/setup-odin@v2
        with:
          release: dev-2026-11
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Build
        shell: cmd
        run: odin\build.bat
      - name: Upload the Windows build
        uses: actions/upload-artifact@v4
        with:
          name: stealth_em_up-windows
          path: |
            odin/bin/stealth_em_up.exe
            odin/bin/steam_api64.dll
